root = "."
tmp_dir = "tmp/mcp"

[build]
cmd = "go build -p 1 -o ./tmp/mcp/mcp ./cmd/mcp"
bin = "tmp/mcp/mcp"
include_ext = ["go"]
exclude_dir = ["assets", "tmp", "vendor", "web"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "6s"

[misc]
clean_on_exit = true
