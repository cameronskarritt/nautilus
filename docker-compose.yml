services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    networks:
      - app-network
    ports:
      - "8080:80"
    restart: always
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile.development
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      ministack:
        condition: service_started
    env_file:
      - .env.keys
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    networks:
      - app-network
    expose:
      - "8081"
    restart: always

  redis:
    command: ["redis-server"]
    image: redis:alpine
    networks:
      - app-network
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis-data:/data

  postgres:
    environment:
      POSTGRES_DB: nautilus
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    expose:
      - "5432"
    image: postgres:alpine
    networks:
      - app-network
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ministack:
    image: ministackorg/ministack
    environment:
      PERSIST_STATE: "1"
      STATE_DIR: /tmp/ministack-state
      S3_PERSIST: "1"
      S3_DATA_DIR: /tmp/ministack-state/s3
    networks:
      - app-network
    ports:
      - "4566:4566"
    restart: always
    stop_grace_period: 45s
    volumes:
      - ministack-data:/tmp/ministack-state

networks:
  app-network:

volumes:
  app-data:
  caddy-data:
  caddy-config:
  redis-data:
  postgres-data:
  ministack-data:
  gomodcache:
  gobuildcache:
