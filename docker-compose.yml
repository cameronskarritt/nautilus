services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    networks:
      - app-network
    ports:
      - "8080:80"
    restart: always
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile.development
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started
      ministack:
        condition: service_started
      temporal:
        condition: service_healthy
    env_file:
      - .env.keys
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: nautilus
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    networks:
      - app-network
    expose:
      - "8081"
    restart: always

  worker: &worker
    build:
      context: .
      dockerfile: Dockerfile.development
    command: ["dotenvx", "run", "--", "air", "-c", ".air.worker.toml"]
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_started
      opensearch:
        condition: service_healthy
    env_file:
      - .env.keys
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: nautilus
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX: nautilus-documents-v1
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    networks:
      - app-network
    restart: always
    stop_grace_period: 45s

  smoke-worker:
    <<: *worker
    command: ["dotenvx", "run", "--", "air", "-c", ".air.smoke.toml"]
    depends_on:
      temporal:
        condition: service_healthy

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' | grep -q '\"timed_out\"[[:space:]]*:[[:space:]]*false'"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      - app-network
    ports:
      - "127.0.0.1:9200:9200"
    restart: always
    stop_grace_period: 45s
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  temporal:
    image: temporalio/temporal:1.8.3
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --db-filename
      - /home/temporal/temporal.db
      - --namespace
      - nautilus
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app-network
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    restart: always
    stop_grace_period: 30s
    volumes:
      - temporal-data:/home/temporal

  redis:
    command: ["redis-server"]
    image: redis:alpine
    networks:
      - app-network
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis-data:/data

  postgres:
    environment:
      POSTGRES_DB: nautilus
      POSTGRES_USER: app
      POSTGRES_PASSWORD: password
    expose:
      - "5432"
    image: postgres:18-alpine
    networks:
      - app-network
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql

  ministack:
    image: ministackorg/ministack
    environment:
      PERSIST_STATE: "1"
      STATE_DIR: /tmp/ministack-state
      S3_PERSIST: "1"
      S3_DATA_DIR: /tmp/ministack-state/s3
    networks:
      - app-network
    ports:
      - "4566:4566"
    restart: always
    stop_grace_period: 45s
    volumes:
      - ministack-data:/tmp/ministack-state

networks:
  app-network:

volumes:
  app-data:
  caddy-data:
  caddy-config:
  redis-data:
  postgres-data:
  ministack-data:
  temporal-data:
  opensearch-data:
  gomodcache:
  gobuildcache:
