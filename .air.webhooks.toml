root = "."
tmp_dir = "tmp/webhooks"

[build]
cmd = "go build -p 1 -o ./tmp/webhooks/worker ./cmd/worker"
bin = "tmp/webhooks/worker"
args_bin = ["--queue=webhooks"]
include_ext = ["go"]
exclude_dir = ["assets", "tmp", "vendor", "web"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "42s"

[misc]
clean_on_exit = true
