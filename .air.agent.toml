root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -p 1 -o ./tmp/agent ./cmd/agent"
bin = "tmp/agent"
include_ext = ["go", "template"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 0
stop_on_error = true
kill_delay = 500

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
