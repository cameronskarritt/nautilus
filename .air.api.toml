root = "."
tmp_dir = "tmp/api"

[build]
cmd = "go build -p 1 -o ./tmp/api/api ./cmd/api"
bin = "tmp/api/api"
include_ext = ["go"]
exclude_dir = ["assets", "tmp", "vendor", "web"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
stop_on_error = true
send_interrupt = true
kill_delay = "6s"

[misc]
clean_on_exit = true
